name: Ad hoc install

# Builds an ad hoc signed Fleet.ipa and publishes it on GitHub Pages with a
# tap-to-install link (itms-services://), like Expo's internal distribution.
# It installs only on devices registered on the Apple team. See "Install on an
# iPhone" in README.md for the one-time setup.
#
# Signing: a fixed Apple Distribution certificate (DIST_CERT_P12) plus an ad
# hoc profile that ci/asc.py fetches or remakes through the App Store Connect
# API on each run, so it always covers every enabled device on the team.
#
# Never runs on pull requests: it uses signing secrets. Without the secrets the
# build is skipped and the run still passes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adhoc
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DIST_CERT_P12 DIST_CERT_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::notice::Ad hoc builds publish from main only; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::notice::Ad hoc build skipped. Missing secrets:$missing (see README.md, Install on an iPhone)."
            echo "Ad hoc build skipped. Missing secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      BUNDLE_ID: dev.portersmith.fleet
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # Tools first, before any secret touches the disk.
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: |
          xcodegen generate
          xcodebuild -version

      - name: Import the distribution certificate
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(openssl rand -hex 24)"
          echo "::add-mask::$KCPW"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -f pkcs12 -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          SERIAL="$(security find-certificate -c "Apple Distribution" -p "$KC" | openssl x509 -noout -serial | cut -d= -f2)"
          [ -n "$SERIAL" ] || { echo "no Apple Distribution certificate in DIST_CERT_P12"; exit 1; }
          security find-identity -v -p codesigning "$KC" | sed -E 's/[0-9A-F]{40}/<sha1>/'
          echo "KC=$KC" >> "$GITHUB_ENV"
          echo "CERT_SERIAL=$SERIAL" >> "$GITHUB_ENV"

      - name: Fetch the ad hoc profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DEVICE_UDIDS: ${{ secrets.IOS_DEVICE_UDIDS }}
        run: |
          PP="$RUNNER_TEMP/fleet.mobileprovision"
          python3 -I ci/asc.py adhoc-profile --bundle-id "$BUNDLE_ID" --cert-serial "$CERT_SERIAL" --out "$PP" | tee "$RUNNER_TEMP/profile.txt"
          UUID="$(sed -n 's/^uuid=//p' "$RUNNER_TEMP/profile.txt")"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$PP" "$d/$UUID.mobileprovision"
          done
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project Fleet.xcodeproj \
            -scheme Fleet \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Fleet.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            FLEET_PROVISIONING_PROFILE="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            > "$RUNNER_TEMP/archive.log" 2>&1 && status=0 || status=$?
          grep -E 'error:|warning: .*(sign|profile)|\*\* ' "$RUNNER_TEMP/archive.log" | tail -60 || true
          [ $status = 0 ] || tail -80 "$RUNNER_TEMP/archive.log"
          exit $status

      - name: Export the ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
            <key>thinning</key><string>&lt;none&gt;</string>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Fleet.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            > "$RUNNER_TEMP/export.log" 2>&1 && status=0 || status=$?
          grep -E 'error:|\*\* ' "$RUNNER_TEMP/export.log" | tail -40 || true
          [ $status = 0 ] || tail -80 "$RUNNER_TEMP/export.log"
          exit $status

      - name: Check the signature
        run: |
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa)"
          rm -rf "$RUNNER_TEMP/check" && mkdir "$RUNNER_TEMP/check"
          unzip -q "$IPA" -d "$RUNNER_TEMP/check"
          APP="$(ls -d "$RUNNER_TEMP"/check/Payload/*.app)"
          codesign --verify --deep --strict "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier)='
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/embedded.plist"
          echo "profile: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/embedded.plist"), $(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/embedded.plist" | grep -c '^ ') device(s)"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/embedded.plist" | grep -qx false
          echo "files in the ipa:"
          (cd "$RUNNER_TEMP/check" && find Payload -type f | sed 's|^Payload/[^/]*/||' | sort | head -100)

      - name: Build the install page
        run: |
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa)"
          INFO="$RUNNER_TEMP/Fleet.xcarchive/Info.plist"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$INFO")"
          BUILT="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' "$INFO")"
          [ "$BUILT" = "$BUILD_NUMBER" ] || { echo "CFBundleVersion is $BUILT, expected $BUILD_NUMBER"; exit 1; }
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          BASE="https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}"
          NAME="Fleet-$VERSION-$BUILD_NUMBER.ipa"
          SHA="${GITHUB_SHA:0:7}"
          DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          SITE="$GITHUB_WORKSPACE/site"
          mkdir -p "$SITE"
          cp "$IPA" "$SITE/$NAME"
          cat > "$SITE/manifest.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>$BASE/$NAME</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>$BUNDLE_ID</string>
                  <key>bundle-version</key><string>$VERSION</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>Fleet $VERSION ($BUILD_NUMBER)</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF
          INSTALL="itms-services://?action=download-manifest&amp;url=$BASE/manifest.plist?b=$BUILD_NUMBER"
          cat > "$SITE/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex">
          <title>Install Fleet</title>
          <style>
            body { font: 17px -apple-system, system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1.25rem; color: #111; }
            a.install { display: block; text-align: center; background: #0a84ff; color: #fff; padding: 1rem; border-radius: 14px; font-weight: 600; text-decoration: none; margin: 1.5rem 0; }
            .meta { color: #666; font-size: 15px; }
            li { margin: .4rem 0; }
            @media (prefers-color-scheme: dark) { body { background: #000; color: #eee; } .meta { color: #999; } }
          </style>
          </head>
          <body>
          <h1>Fleet</h1>
          <p class="meta">Version $VERSION, build $BUILD_NUMBER, commit $SHA, built $DATE</p>
          <a class="install" href="$INSTALL">Install Fleet</a>
          <ul class="meta">
            <li>Open this page in Safari on your iPhone. Tap <b>Install Fleet</b>, then <b>Install</b>.</li>
            <li>It installs only on iPhones registered on the Apple developer team.</li>
            <li>The first time, turn on <b>Settings &gt; Privacy &amp; Security &gt; Developer Mode</b> and restart.</li>
            <li>To update, tap Install again. A newer build replaces the app and keeps its data.</li>
          </ul>
          </body>
          </html>
          EOF
          ls -la "$SITE"
          echo "Install page: $BASE/ (build $BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 1

      - name: Remove signing material
        if: always()
        run: |
          [ -n "${KC:-}" ] && security delete-keychain "$KC" || true
          rm -rf "$RUNNER_TEMP"/*.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
