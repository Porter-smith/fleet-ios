name: iOS

# Builds and tests the app: FleetKit unit tests (SSE parser, JSON decoding
# against captured API fixtures, transcript nesting, controls, demo mode), then
# a UI test that walks the app in demo mode and saves screenshots. No server and
# no secrets: the demo serves the bundled fixtures.
#
# Written for the root of github.com/Porter-smith/fleet-ios. In agent-fleet it
# lives in ios/.github/ (where GitHub ignores it); scripts/publish-github.sh
# copies it over.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      SHOTS: ${{ github.workspace }}/screenshots
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      - uses: actions/cache@v4
        with:
          path: FleetKit/.build
          key: fleetkit-${{ runner.os }}-${{ hashFiles('FleetKit/Package.swift', 'FleetKit/Sources/**', 'FleetKit/Tests/**/*.swift') }}
          restore-keys: fleetkit-${{ runner.os }}-

      - name: FleetKit unit tests
        working-directory: FleetKit
        run: swift test

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), key=lambda r: [int(x) for x in r.split("iOS-")[-1].split("-")])
          for runtime in reversed(runtimes):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]] or [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[-1]["udid"]); break
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true

      - name: Build and run the UI tests
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ env.SHOTS }}
        run: |
          mkdir -p "$SHOTS"
          xcodebuild test \
            -project Fleet.xcodeproj \
            -scheme Fleet \
            -destination "id=$UDID" \
            -resultBundlePath "$RUNNER_TEMP/Fleet.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 && status=0 || status=$?
          grep -E 'error:|warning: .*/Fleet/|Test Case|Executed|\*\* ' "$RUNNER_TEMP/xcodebuild.log" | tail -150 || true
          exit $status

      - name: Export screenshots from the result bundle
        if: always()
        run: |
          mkdir -p "$SHOTS"
          if [ -z "$(ls -A "$SHOTS" 2>/dev/null)" ] && [ -d "$RUNNER_TEMP/Fleet.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Fleet.xcresult" --output-path "$SHOTS" || true
          fi
          ls -la "$SHOTS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/Fleet.xcresult
          if-no-files-found: ignore
