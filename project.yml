name: Fleet
options:
  bundleIdPrefix: dev.portersmith
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FleetKit:
    path: FleetKit
targets:
  Fleet:
    type: application
    platform: iOS
    sources:
      - Fleet
    dependencies:
      - package: FleetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.portersmith.fleet
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: Fleet/Info.plist
      properties:
        CFBundleDisplayName: Fleet
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Fleet connects to your Fleet server on the local network or over Tailscale.
        NSAppTransportSecurity:
          # The server is private (Tailscale or LAN). Caddy's internal CA covers
          # HTTPS once trusted on the device; plain http stays allowed only for
          # local addresses (and the dev server on 127.0.0.1).
          NSAllowsLocalNetworking: true
  FleetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FleetUITests
    dependencies:
      - target: Fleet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.portersmith.fleet.uitests
        TEST_TARGET_NAME: Fleet
schemes:
  Fleet:
    build:
      targets:
        Fleet: all
        FleetUITests: [test]
    test:
      targets:
        - FleetUITests
